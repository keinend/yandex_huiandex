name: Diagnose RPM packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev rpm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install electron-builder install-app-deps
      - name: Build RPM with full FPM output
        env:
          DEBUG: electron-builder
        run: |
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.build.rpm={fpm:["--verbose","--debug"]}; fs.writeFileSync("package.json",JSON.stringify(p,null,2));'
          npm run dist -- --linux rpm --publish never
